<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anneora</title>
<link rel="icon" type="image/png" href="../../pictures/website_logo.png?v=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: #080808;
    background-image:
      linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.42)),
      url('../../assets/anneora-butterfly-background.png');
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    color: var(--bone-100);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .grain {
    position: fixed; inset: 0; z-index: 50;
    background: url('../../assets/noise.svg');
    opacity: 0.02; pointer-events: none;
  }
  .celestial-cursor { display: none; }
  @media (hover: hover) and (pointer: fine) {
    html.has-celestial-cursor, html.has-celestial-cursor * { cursor: none !important; }
    .celestial-cursor {
      display: block; position: fixed; top: 0; left: 0; width: 1px; height: 1px;
      z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 160ms ease;
      color: #e8e5df; will-change: transform;
    }
    .celestial-cursor[data-visible="true"] { opacity: 1; }
    .celestial-cursor__sigil { position: absolute; width: 34px; height: 34px; left: -17px; top: -17px; overflow: visible; filter: drop-shadow(0 0 3px rgba(232,229,223,0.28)); }
    .celestial-cursor__sigil path { vector-effect: non-scaling-stroke; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; transition: opacity 190ms ease, transform 330ms cubic-bezier(.16,1,.3,1); }
    .celestial-cursor__cross { fill: currentColor; stroke: none !important; opacity: 1; transform: scale(.42) rotate(0deg); }
    .celestial-cursor__halo { opacity: 0; transform: scale(.35) rotate(-20deg); }
    .celestial-cursor__dagger { opacity: 0; transform: scale(.42); }
    .celestial-cursor__wings { opacity: 0; transform-origin: center; transform: scale(.56); transition: opacity 190ms ease, transform 360ms cubic-bezier(.16,1,.3,1); }
    .celestial-cursor__wings path { stroke: currentColor; stroke-width: 1; fill: none; }
    .celestial-cursor[data-mode="pointer"] .celestial-cursor__cross { transform: scale(.5) rotate(45deg); }
    .celestial-cursor[data-mode="pointer"] .celestial-cursor__halo { opacity: .92; transform: scale(1) rotate(12deg); }
    .celestial-cursor[data-mode="text"] .celestial-cursor__cross, .celestial-cursor[data-mode="text"] .celestial-cursor__halo { opacity: 0; transform: scale(.25); }
    .celestial-cursor[data-mode="text"] .celestial-cursor__dagger { opacity: 1; transform: scale(.72); }
    .celestial-cursor[data-mode="wings"] .celestial-cursor__halo { opacity: .34; transform: scale(.82) rotate(22deg); }
    .celestial-cursor[data-mode="wings"] .celestial-cursor__cross { transform: scale(.46) rotate(0deg); }
    .celestial-cursor[data-mode="wings"] .celestial-cursor__wings { opacity: .76; transform: scale(1); }
    .celestial-cursor[data-pressed="true"] .celestial-cursor__sigil { transform: scale(.78); filter: drop-shadow(0 0 1px rgba(232,229,223,0.18)); }
    .celestial-cursor__ghost { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border: 1px solid rgba(232,229,223,.42); border-radius: 50%; opacity: .18; will-change: transform; }
    .celestial-cursor__ghost--two { width: 2px; height: 2px; left: -1px; top: -1px; opacity: .12; }
    .celestial-cursor__particles { position: absolute; inset: 0; }
    .celestial-cursor__particles i { position: absolute; left: -1px; top: -1px; width: 2px; height: 2px; border-radius: 50%; background: currentColor; box-shadow: 0 0 4px rgba(232,229,223,.55); animation: celestial-particle 320ms ease-out forwards; }
    @keyframes celestial-particle { from { opacity: .8; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(var(--particle-x), var(--particle-y)) scale(.3); } }
  }
  .nav-fixed { position: fixed; top: 0; left: 0; right: 0; z-index: 40; }
  .responsive-nav-shell { position: relative; }
  .responsive-nav-toggle, .responsive-nav-menu { display: none; }
  @keyframes drift { from { transform: translateY(16px); filter: blur(8px); } to { transform: none; filter: none; } }
  /* base state is fully visible; entrance animates blur/transform only (opacity stays 1),
     so content is never hidden in print / hidden-tab renders. No transform on the
     sticky dissolve section, so its pin is unaffected. */
  #app-sections > .drift { opacity: 1; }
  .about-vinyl { position: relative; width: 132px; height: 132px; z-index: 0; outline: none; }
  .about-vinyl:hover, .about-vinyl:focus-visible { z-index: 4; }
  .about-vinyl__record { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; background: #050505; transform-origin: center; transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 600ms cubic-bezier(0.16, 1, 0.3, 1); }
  .about-vinyl__record::before { content: ''; position: absolute; inset: 0; z-index: 1; border-radius: inherit; background: repeating-radial-gradient(circle at center, transparent 0 5px, rgba(255,255,255,0.48) 5.35px 5.85px, transparent 6.2px 10px); opacity: 0; transition: opacity 320ms ease; pointer-events: none; }
  .about-vinyl__record img { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1px solid var(--veil-12); filter: grayscale(0.4) contrast(1.05) brightness(0.9); box-shadow: 0 0 40px rgba(255,255,255,0.08); transition: opacity 320ms ease, filter 320ms; }
  .about-vinyl:hover .about-vinyl__record, .about-vinyl:focus-visible .about-vinyl__record { transform: scale(1.35); animation: about-vinyl-spin 3.8s linear infinite; box-shadow: 0 0 28px rgba(255,255,255,0.16); -webkit-mask: radial-gradient(circle at center, transparent 0 8%, #000 8.5%); mask: radial-gradient(circle at center, transparent 0 8%, #000 8.5%); }
  .about-vinyl:hover .about-vinyl__record::before, .about-vinyl:focus-visible .about-vinyl__record::before { opacity: 0.62; }
  .about-vinyl:hover .about-vinyl__record img, .about-vinyl:focus-visible .about-vinyl__record img { filter: grayscale(0.55) contrast(0.76) brightness(1.12); }
  @keyframes about-vinyl-spin { to { transform: scale(1.35) rotate(360deg); } }
  .visions-gallery { max-width: 1000px; margin: 0 auto; padding: 80px 24px; }
  .visions-gallery__heading { text-align: center; margin-bottom: 38px; }
  .visions-gallery__heading > span {
    display: block; margin-bottom: 10px; font-size: 0.65rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--bone-400);
  }
  .visions-gallery__viewport { width: 100%; overflow: hidden; }
  .visions-gallery__track { --gallery-gap: 14px; display: flex; gap: var(--gallery-gap); width: max-content; animation: visions-drift 95s linear infinite; }
  .visions-gallery__tile { flex: 0 0 min(239px, calc((100vw - 90px) / 4)); min-width: 0; padding: 0; border: 1px solid var(--veil-12); background: var(--void-700); cursor: pointer; overflow: hidden; box-shadow: var(--shadow-float); }
  .visions-gallery__tile:nth-child(odd) { aspect-ratio: 3 / 4; }
  .visions-gallery__tile:nth-child(even) { aspect-ratio: 3 / 4.4; }
  .visions-gallery__tile img { width: 100%; height: 100%; display: block; object-fit: cover; filter: saturate(0.8) contrast(1.05); transition: transform 600ms var(--ease-out); }
  .visions-gallery__tile:hover img, .visions-gallery__tile:focus-visible img { transform: scale(1.045); }
  @keyframes visions-drift { from { transform: translateX(calc(-50% - (var(--gallery-gap) / 2))); } to { transform: translateX(0); } }
  .image-lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.94); backdrop-filter: blur(16px); }
  .image-lightbox { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 24px 28px; cursor: zoom-out; }
  .image-lightbox img { max-width: min(92vw, 1100px); max-height: 80vh; object-fit: contain; cursor: default; box-shadow: var(--shadow-float); }
  .image-lightbox__close { position: absolute; top: 22px; right: 28px; }
  .image-lightbox p { color: var(--bone-400); margin: 18px 0 0; font-size: .65rem; text-transform: uppercase; letter-spacing: .18em; }
  @media (max-width: 640px) {
    .visions-gallery { padding: 64px 18px; }
    .visions-gallery__heading { margin-bottom: 20px; }
    .visions-gallery__track { --gallery-gap: 8px; animation-duration: 75s; }
    .visions-gallery__tile { flex-basis: calc((100vw - 42px) / 2); }
  }
  @media (max-width: 680px) {
    .responsive-nav { padding: 16px 20px !important; }
    .responsive-nav > div { display: none !important; }
    .responsive-nav-toggle { position: absolute; top: 16px; right: 20px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 34px; height: 34px; padding: 0; border: 0; background: transparent; color: var(--bone-50); cursor: pointer; }
    .responsive-nav-toggle span { width: 20px; height: 1px; background: currentColor; transition: transform 220ms ease, opacity 220ms ease; }
    .responsive-nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .responsive-nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .responsive-nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
    .responsive-nav-menu { position: absolute; top: calc(100% + 8px); left: 12px; right: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; background: rgba(8,8,8,0.78); backdrop-filter: blur(18px); box-shadow: 0 16px 40px rgba(0,0,0,0.38); }
    .responsive-nav-menu.is-open { display: grid; gap: 2px; }
    .responsive-nav-menu button { width: 100%; padding: 14px 12px; border: 0; background: transparent; color: var(--bone-100); cursor: pointer; font-family: 'Inter', system-ui, sans-serif; font-size: 0.7rem; font-weight: 400; letter-spacing: 0.18em; text-align: left; text-transform: uppercase; }
  }
  @media (prefers-reduced-motion: reduce) { .visions-gallery__track, .about-vinyl:hover .about-vinyl__record, .about-vinyl:focus-visible .about-vinyl__record { animation: none; } }
  @media (prefers-reduced-motion: no-preference) {
    #app-sections > .drift { animation: drift 1100ms cubic-bezier(0.16,1,0.3,1) backwards; }
  }
</style>
</head>
<body>
<div class="grain"></div>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-bundle.js"></script>
<script type="text/babel" src="DropImage.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="AngelDissolve.jsx"></script>
<script type="text/babel" src="MusicSection.jsx"></script>
<script type="text/babel" src="Gallery.jsx"></script>
<script type="text/babel" src="AboutSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="CelestialCursor.jsx"></script>
<script type="text/babel">
  const { NavBar, Button } = window.AnneoraDesignSystem_7f3db2;

  function ResponsiveNav({ active, onNavigate, scrolled }) {
    const [menuOpen, setMenuOpen] = React.useState(false);
    const mobileLinks = ['Music', 'Visions', 'About', 'Contact'];
    const navigate = (label) => {
      setMenuOpen(false);
      onNavigate(label);
    };

    return (
      <div className="responsive-nav-shell">
        <NavBar
          className="responsive-nav"
          links={['Music', 'Visions', 'About']}
          active={active}
          onNavigate={navigate}
          onBrandClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          scrolled={scrolled}
          right={<Button size="sm" variant="ghost" onClick={() => navigate('Contact')}>Contact</Button>}
        />
        <button type="button" className="responsive-nav-toggle" aria-label="Open navigation menu" aria-expanded={menuOpen} onClick={() => setMenuOpen(open => !open)}><span /><span /><span /></button>
        <div className={`responsive-nav-menu${menuOpen ? ' is-open' : ''}`}>
          {mobileLinks.map(label => <button key={label} type="button" onClick={() => navigate(label)}>{label}</button>)}
        </div>
      </div>
    );
  }

  function App() {
    const [scrolled, setScrolled] = React.useState(false);
    const [active, setActive] = React.useState('Music');
    const [playing, setPlaying] = React.useState(null);
    const [selected, setSelected] = React.useState(null);
    const [progress, setProgress] = React.useState(0);
    const audioRef = React.useRef(null);
    const previewLimitedRef = React.useRef(false);

    React.useEffect(() => {
      const onScroll = () => setScrolled(window.scrollY > 40);
      window.addEventListener('scroll', onScroll);
      return () => window.removeEventListener('scroll', onScroll);
    }, []);

    React.useEffect(() => {
      return () => audioRef.current?.pause();
    }, []);

    const toggle = (track) => {
      const current = audioRef.current;
      if (playing === track.title) {
        current?.pause();
        setPlaying(null);
        return;
      }

      // Resume a paused track at its current position. A manually moved slider
      // lifts the default preview limit, so listeners can explore the full song.
      if (selected === track.title && current) {
        if (previewLimitedRef.current && track.previewEnd && current.currentTime >= track.previewEnd) {
          current.currentTime = track.previewStart || 0;
          previewLimitedRef.current = true;
        }
        setPlaying(track.title);
        current.play().catch(() => setPlaying(null));
        return;
      }

      current?.pause();
      const audio = new Audio();
      audio.preload = 'metadata';
      audio.src = track.audio;
      audioRef.current = audio;
      setSelected(track.title);

      const startPreview = () => {
        audio.currentTime = track.previewStart || 0;
        previewLimitedRef.current = Boolean(track.previewEnd);
        setProgress(audio.duration ? audio.currentTime / audio.duration : 0);
        setPlaying(track.title);
        audio.play().catch(() => {
          if (audioRef.current === audio) setPlaying(null);
        });
      };

      audio.addEventListener('timeupdate', () => {
        setProgress(audio.duration ? audio.currentTime / audio.duration : 0);
        if (previewLimitedRef.current && track.previewEnd && audio.currentTime >= track.previewEnd) {
          audio.pause();
          audio.currentTime = track.previewEnd;
          setProgress(audio.duration ? audio.currentTime / audio.duration : 0);
          setPlaying(null);
        }
      });
      audio.addEventListener('ended', () => {
        setPlaying(null);
        setProgress(0);
      });
      if (audio.readyState >= HTMLMediaElement.HAVE_METADATA) startPreview();
      else audio.addEventListener('loadedmetadata', startPreview, { once: true });
    };
    const seek = (track, value) => {
      const audio = audioRef.current;
      if (!audio || selected !== track.title || !Number.isFinite(audio.duration)) return;
      previewLimitedRef.current = false;
      audio.currentTime = value * audio.duration;
      setProgress(value);
    };
    const go = (label) => {
      setActive(label);
      const id = label.toLowerCase();
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
    };

    return (
      <React.Fragment>
        <window.CelestialCursor />
        <div className="nav-fixed">
          <ResponsiveNav
            active={active}
            onNavigate={go}
            scrolled={scrolled}
          />
        </div>
        <div id="app-sections">
          <window.AngelDissolve />
          <div className="drift"><window.MusicSection playing={playing} selected={selected} progress={progress} onToggle={toggle} onSeek={seek} /></div>
          <div className="drift"><window.Gallery /></div>
          <div className="drift"><window.AboutSection /></div>
          <div className="drift"><window.Footer /></div>
        </div>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
